name: Build DimensityBoost

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Unzip source
        run: |
          unzip -o "DimensityBoost-revised-source.zip" || unzip -o "DimensityBoost-revised-source" || unzip -o "*.zip"
          ROOT=$(find . -name build.gradle -not -path './.git/*' | head -1 | xargs dirname)
          echo "PROJECT_ROOT=$ROOT" >> $GITHUB_ENV
          echo "Using project root: $ROOT"
          ls -la "$ROOT"

      - name: Build
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle build --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3G -Dorg.gradle.daemon=false"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: dimensityboost-jar
          path: |
            **/build/libs/dimensityboost-*.jar
            !**/build/libs/*-sources.jar
            !**/build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 14
